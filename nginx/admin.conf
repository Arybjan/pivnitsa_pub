# Админка на стенде: браузер перепроверяет файлы при каждом открытии,
# чтобы после правок не висели старые css/js из кэша
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # редиректы без хоста и порта: внутри контейнера порт 80, снаружи 3000
    absolute_redirect off;

    location / {
        add_header Cache-Control "no-cache" always;
        # адреса без .html (/main-menu/main) - так их отдавал npx serve,
        # и браузеры запомнили его редиректы
        try_files $uri $uri.html $uri/ =404;
    }

    # в корне нет index.html (у каждой страницы своя папка) - иначе nginx отвечал 403.
    # Меню само отправляет на вход, если сессии нет
    location = / {
        return 302 /main-menu/main.html;
    }

    # иконки нет - не засоряем лог 404
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}
