# Админка на стенде: браузер перепроверяет файлы при каждом открытии,
# чтобы после правок не висели старые css/js из кэша
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # иконки нет - не засоряем лог 404
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}
