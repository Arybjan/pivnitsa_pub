<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../normalize/normalize.css?v=20261013b">
  <link rel="stylesheet" href="../ui/ui.css?v=20261013b">
  <link rel="stylesheet" href="../login-form/index.css?v=20261013b">
  <link rel="stylesheet" href="./index.css?v=20261013b">
  <title>Регистрация: Бар Пивница</title>
</head>
<body>

  <main class="login-container">
    <div class="login-card">

      <div class="card-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/>
            <path d="M15 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/>
            <path d="M5 8a2.5 2.5 0 0 1 2.5-3 3 3 0 0 1 5 0A2.5 2.5 0 0 1 15 8"/>
            <path d="M9 12v5M12 12v5"/>
          </svg>
        </div>
        <h1>Регистрация</h1>
        <p class="subtitle">Бар Пивница</p>
      </div>

      <!-- Форма регистрации -->
      <form id="registerForm" class="login-form" novalidate>

        <!-- Шаг 1: номер телефона -->
        <div class="form-group">
          <label for="phoneInput">Номер телефона</label>
          <div class="input-wrapper">
            <span class="country-code">+996</span>
            <input type="text"
            inputmode="numeric"
            id="phoneInput"
            placeholder="555 123 456"
            maxlength="9"
            autocomplete="tel-national"
            required>
          </div>

          <span class="error-message" id="phoneError"></span>
          <button type="button" id="changePhoneBtn" class="btn-link hidden">Изменить номер</button>
        </div>

        <button type="button" id="requestCodeBtn" class="btn btn-primary">Получить код</button>

        <!-- Шаг 2: код, имя и пароль -->
        <div id="detailsStep" class="hidden">
          <div class="form-group">
            <label for="smsInput">SMS-код</label>
            <input type="text"
            id="smsInput"
            inputmode="numeric"
            placeholder="Введите код из SMS"
            maxlength="8"
            autocomplete="one-time-code">

            <span class="error-message" id="smsError"></span>
          </div>

          <div class="timer-text" id="timerContainer">
            Повторный код будет доступен через: <span id="timer">60</span> секунд
          </div>

          <button type="button" id="resendBtn" class="btn-link hidden">Отправить код снова</button>

          <div class="form-row">
            <div class="form-group">
              <label for="firstNameInput">Имя</label>
              <input type="text" id="firstNameInput" maxlength="100" autocomplete="given-name" required>
            </div>

            <div class="form-group">
              <label for="lastNameInput">Фамилия</label>
              <input type="text" id="lastNameInput" maxlength="100" autocomplete="family-name">
            </div>
          </div>

          <span class="error-message" id="nameError"></span>

          <div class="form-group">
            <label for="passwordInput">Пароль</label>
            <input type="password"
            id="passwordInput"
            placeholder="От 8 символов, буквы и цифры"
            autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="passwordRepeat">Повторите пароль</label>
            <input type="password"
            id="passwordRepeat"
            autocomplete="new-password">

            <span class="error-message" id="passwordError"></span>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">Зарегистрироваться</button>
        </div>

      </form>

      <!-- После регистрации -->
      <div id="successStep" class="success-step hidden">
        <div class="success-icon">✓</div>
        <h2>Аккаунт создан</h2>
        <p>
          Чтобы войти в админ-панель, владелец заведения должен выдать вам доступ.
          После этого входите по номеру и паролю или по SMS.
        </p>
      </div>

      <a href="../login-form/index.html" id="loginLink" class="btn-link login-link">Уже есть аккаунт? Войти</a>

      <p class="card-footer">Админ-панель бара «Пивница»</p>

    </div>
  </main>
  <script src="../ui/ui.js?v=20261013b"></script>
  <script src="../api/api.js?v=20261013b"></script>

  <script src="./index.js?v=20261013b"></script>
</body>
</html>
