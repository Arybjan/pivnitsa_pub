version: '3.8'

services:
  event-service:
    build: .
    container_name: event-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/event_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nightclub-network

  postgres:
    image: postgres:15
    container_name: event-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=event_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nightclub-network

  redis:
    image: redis:7-alpine
    container_name: event-redis
    ports:
      - "6379:6379"
    networks:
      - nightclub-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: event-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - nightclub-network

volumes:
  postgres_data:

networks:
  nightclub-network:
    driver: bridge
