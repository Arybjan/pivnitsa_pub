name: pivnitsa-venue

services:
  venue-service:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-venue}:${POSTGRES_PASSWORD:-venue}@venue-db:5432/${POSTGRES_DB:-venue}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set the Auth Service JWT_SECRET_KEY in .env}
    ports:
      - "8003:8000"
    depends_on:
      venue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  venue-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-venue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venue}
      POSTGRES_DB: ${POSTGRES_DB:-venue}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - venue-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venue-data:
