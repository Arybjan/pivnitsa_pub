name: Venue service

on:
  push:
    paths:
      - "services/venue-service/**"
      - ".github/workflows/venue-service.yml"
  pull_request:
    paths:
      - "services/venue-service/**"
      - ".github/workflows/venue-service.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/venue-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET_KEY: venue-ci-key-that-is-not-used-in-production
      TEST_DATABASE_URL: postgresql+psycopg://venue:venue@localhost:5432/venue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/venue-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
