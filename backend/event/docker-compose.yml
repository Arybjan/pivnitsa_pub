services:
  event-service:
    build: .
    container_name: event-service
    ports:
      - "${EVENT_SERVICE_PORT:-8002}:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/event_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=${JWT_SECRET:-${JWT_SECRET_KEY:?Set JWT_SECRET or JWT_SECRET_KEY}}
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nightclub-network

  postgres:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    container_name: event-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=event_db
    ports:
      - "${EVENT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nightclub-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    container_name: event-redis
    ports:
      - "${EVENT_REDIS_PORT:-6380}:6379"
    networks:
      - nightclub-network

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    container_name: event-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "${EVENT_RABBITMQ_PORT:-5673}:5672"
      - "${EVENT_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    networks:
      - nightclub-network

volumes:
  postgres_data:

networks:
  nightclub-network:
    driver: bridge
